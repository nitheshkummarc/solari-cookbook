# Live integration run for solari-doctor.
#
# Deliberately not on push or pull_request. It needs a real API key, creates
# real sessions and sandboxes, and is slow and network-dependent — none of which
# belongs in a gate that every change has to pass.
#
# Triggered manually, plus a weekly run so SDK or gateway changes are noticed
# without anyone remembering to look.

name: solari-doctor live integration

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Include expensive checks (--full)"
        type: boolean
        default: false
  schedule:
    # Sunday 03:00 UTC.
    - cron: "0 3 * * 0"

permissions:
  contents: read

# One at a time. Two concurrent runs would compete for the same account's
# concurrency limit and could report a spurious 429.
concurrency:
  group: solari-doctor-live
  cancel-in-progress: false

defaults:
  run:
    working-directory: solari-doctor

jobs:
  live:
    name: live checks
    runs-on: ubuntu-latest
    # A hung check would be caught by the tool's own deadlines; this bounds the
    # job even if something upstream of them stalls.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: solari-doctor/package-lock.json

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Run the checks against the live API
        env:
          SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
        run: |
          node dist/bin.js ${{ inputs.full && '--full' || '' }} --report
          echo "exit: $?"

      # Every check kills what it creates in a `finally`, but a cancelled job
      # kills the process outright and `finally` never runs. This is the net for
      # that case. `always()` covers success, failure and cancellation.
      - name: Sweep any sandbox a cancelled run left behind
        if: always()
        env:
          SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
        run: node ci/cleanup.mjs

      # The bundle is sanitised at source, and `report/bundle.test.ts` proves
      # it. This is a second, independent check that no key reached the artifact
      # before it is uploaded anywhere.
      - name: Verify the report carries no credential
        if: always()
        run: |
          if [ -f solari-doctor-report.json ]; then
            if grep -qE 'slr_(live|test)_[A-Za-z0-9_-]{8,}' solari-doctor-report.json; then
              echo "report contains something key-shaped; not uploading"
              rm -f solari-doctor-report.json
              exit 1
            fi
            echo "report is clean"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solari-doctor-report
          path: solari-doctor/solari-doctor-report.json
          if-no-files-found: ignore
          retention-days: 14
